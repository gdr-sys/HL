name: Crea installer Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt pyinstaller pytest
        shell: pwsh

      - name: Scarica ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_res/ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item ffmpeg_tmp/*/bin/ffmpeg.exe build_res/ffmpeg/
          Copy-Item ffmpeg_tmp/*/bin/ffprobe.exe build_res/ffmpeg/
          "$PWD/build_res/ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Scarica il modello vocale italiano
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_res/models | Out-Null
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-it-0.22.zip" -OutFile model.zip
          Expand-Archive model.zip -DestinationPath build_res/models

      - name: Test (analisi, montaggio, interfaccia)
        shell: pwsh
        run: python -m pytest -q

      - name: Crea il programma con PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name RugbyHighlights `
            --collect-all vosk `
            --add-data "build_res/ffmpeg;ffmpeg" `
            --add-data "build_res/models;models" `
            main.py

      - name: Crea la versione portatile (zip)
        shell: pwsh
        run: Compress-Archive -Path dist/RugbyHighlights -DestinationPath RugbyHighlights-portatile.zip

      - name: Crea l'installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: RugbyHighlights-Windows
          path: |
            installer_out/RugbyHighlights-Setup.exe
            RugbyHighlights-portatile.zip

      - name: Pubblica la release (solo con tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_out/RugbyHighlights-Setup.exe
            RugbyHighlights-portatile.zip
